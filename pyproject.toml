[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airquality-leakage"
version = "0.1.0"
description = "Three ways to get R-squared near 1.0 on UCI Air Quality, and what the honest number is"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed to fetch the real dataset; the experiment, the regression, the
# metrics and the synthetic series are all standard library.
data = ["ucimlrepo>=0.0.7"]
dev = ["pytest>=8"]

[project.scripts]
airquality = "airquality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade,
# B bugbear, SIM simplification, C4 comprehensions, RUF ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Long, descriptive test names are the point.
"tests/*" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
